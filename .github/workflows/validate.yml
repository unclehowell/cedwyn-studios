name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate packages, manifests and public-text rules
        run: python3 tools/validate.py
      - name: Show the next open unit
        run: python3 tools/next.py
